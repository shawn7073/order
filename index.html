<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>揪團點餐</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #f4f5f3; --card: #ffffff; --ink: #1d211f; --muted: #6b726e; --line: #e3e6e3;
    --brand: #06c755; --brand-ink: #ffffff; --brand-soft: #e6f8ee;
    --warn: #c77700; --warn-soft: #fff3df; --bad: #d23c3c; --bad-soft: #fde9e9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  button { font: inherit; cursor: pointer; }
  input, textarea { font: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }

  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 16px 12px; }
  header .inner { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: #037a35; }
  .pill.closed { background: var(--warn-soft); color: var(--warn); }
  .pill.done { background: #eceeed; color: var(--muted); }
  .contact { font-size: 14px; color: var(--muted); display: grid; gap: 2px; }
  .contact a { color: var(--ink); }
  .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .tabs { position: sticky; top: 0; z-index: 5; display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; background: none; padding: 12px 0; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--brand); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-top: 12px; overflow: hidden; }
  .card h2 { font-size: 15px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 600; }
  .row .meta { font-size: 13px; color: var(--muted); }
  .row.tap { cursor: pointer; }
  .row.tap:active { background: #f1f3f1; }
  .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .catnav { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 0; scrollbar-width: none; }
  .catnav::-webkit-scrollbar { display: none; }
  .catnav a { flex: none; font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--ink); text-decoration: none; }

  .btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .btn.ghost { background: #eef0ee; color: var(--ink); }
  .btn.warn { background: var(--warn-soft); color: var(--warn); }
  .btn.sm { padding: 6px 10px; font-size: 14px; border-radius: 8px; }
  .btn:disabled { opacity: .5; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.unpaid { background: var(--bad-soft); color: var(--bad); }
  .badge.claimed { background: var(--warn-soft); color: var(--warn); }
  .badge.paid { background: var(--brand-soft); color: #037a35; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .stats div { padding: 12px 4px; }
  .stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; color: var(--muted); }
  .note { font-size: 14px; padding: 12px 14px; background: var(--brand-soft); color: #035a28; }
  .entry { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .entry ul { margin: 6px 0 8px; padding-left: 18px; font-size: 14px; color: var(--muted); }
  .entry.mine { background: #fafdfb; }

  .cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .cartbar .inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .cartbar .sum { flex: 1; font-size: 14px; color: var(--muted); }
  .cartbar .sum b { color: var(--ink); font-size: 18px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 640px; border-radius: 18px 18px 0 0; max-height: 88vh; overflow: auto;
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 4px; font-size: 18px; }
  .sheet .group { margin-top: 14px; }
  .sheet .group > div:first-child { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; }
  .chip.on { border-color: var(--brand); background: var(--brand-soft); color: #035a28; font-weight: 600; }
  .qty { display: flex; align-items: center; gap: 14px; }
  .qty button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 20px; line-height: 1; }
  .field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  .sheet .actions { display: flex; gap: 8px; margin-top: 18px; }
  .sheet .actions .btn { flex: 1; padding: 12px; }

  .manage { padding: 12px 14px; display: grid; gap: 10px; }
  .manage label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .manage label input { width: 90px; }
  .empty { padding: 28px 14px; text-align: center; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #1d211f; color: #fff; padding: 10px 16px;
    border-radius: 10px; font-size: 14px; z-index: 30; max-width: 86vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .loading { padding: 80px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div id="app"><div class="loading">載入中…</div></div>
<div id="toast" class="toast"></div>

<script>
/* ===== 部署前請填入這兩個值 ===== */
const CONFIG = {
  LIFF_ID: '2012021780-ga481B66',               // LINE Developers → LINE Login channel → LIFF 分頁
  API_URL: 'https://script.google.com/macros/s/AKfycbz6nILMcvms9N1fdIWyo0i6KUxSbq7Ba9h-jtKVlj00-lS3Wa7nW_5yTDEXRoLZB222/exec' // Apps Script 部署成網頁應用程式後的網址（結尾是 /exec）
};
/* ================================ */

const S = { orderId: null, view: null, tab: 'menu', cart: [], dirty: false, busy: false };
const STATUS = { open: '收單中', closed: '已收單', done: '已結單' };
const PAY = { unpaid: '未付款', claimed: '待確認', paid: '已收款' };
const METHOD = { linepay: 'LINE Pay', cash: '現金', transfer: '轉帳' };

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Math.round(Number(n) || 0);

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

async function api(action, data = {}) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action, orderId: S.orderId, idToken: liff.getIDToken() }, data))
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '發生錯誤');
  return j;
}

/* ---------- 啟動 ---------- */
async function boot() {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    S.orderId = new URLSearchParams(location.search).get('order');
    if (!S.orderId) { $('#app').innerHTML = '<div class="loading">請從群組裡機器人給的連結開啟。</div>'; return; }
    await refresh(true);
    setInterval(() => { if (document.visibilityState === 'visible' && !S.busy) refresh(false); }, 6000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(false); });
  } catch (e) {
    $('#app').innerHTML = '<div class="loading">' + esc(e.message || e) + '</div>';
  }
}

async function refresh(first) {
  try {
    const v = await api('getOrder');
    apply(v, first);
  } catch (e) {
    if (first) $('#app').innerHTML = '<div class="loading">' + esc(e.message) + '</div>';
  }
}

function apply(v, syncCart) {
  S.view = v;
  if (syncCart || !S.dirty) {
    const mine = v.entries.find(e => e.userId === v.me.userId);
    S.cart = mine ? mine.items.map(i => ({ name: i.name, size: i.size, options: i.options.slice(), qty: i.qty, note: i.note })) : [];
    S.dirty = false;
  }
  render();
}

/* ---------- 價格（前端估算，送出後以後端為準） ---------- */
function findItem(name) {
  for (const c of S.view.store.categories) { const i = c.items.find(x => x.name === name); if (i) return i; }
  return null;
}
function unitPrice(line) {
  const it = findItem(line.name); if (!it) return 0;
  let u = it.sizes && it.sizes.length ? ((it.sizes.find(s => s.name === line.size) || {}).price || 0) : (it.price || 0);
  (line.options || []).forEach(n => { const o = (it.options || []).find(x => x.name === n); if (o) u += Number(o.price) || 0; });
  return u;
}
const cartTotal = () => S.cart.reduce((s, l) => s + unitPrice(l) * l.qty, 0);
const cartCount = () => S.cart.reduce((s, l) => s + l.qty, 0);
function lineLabel(l) {
  return l.name + (l.size ? ' ' + l.size : '') + (l.options && l.options.length ? '（' + l.options.join('、') + '）' : '') + (l.note ? '・' + l.note : '');
}
function itemPriceText(it) {
  return it.sizes && it.sizes.length ? it.sizes.map(s => s.name + ' ' + money(s.price)).join(' / ') : money(it.price);
}

/* ---------- 畫面 ---------- */
function render() {
  const v = S.view; const o = v.order; const st = v.store;
  const contact = [
    st.phone && '☎ ' + st.phone.split(/[、,，\/]/).map(p => p.trim()).filter(Boolean)
      .map(p => '<a href="tel:' + esc(p.replace(/[^\d+#]/g, '')) + '">' + esc(p) + '</a>').join('、'),
    st.address && '📍 ' + esc(st.address),
    st.hours && '🕘 ' + esc(st.hours),
    st.line && '🟢 LINE <a href="' + esc(st.lineUrl) + '">' + esc(st.line) + '</a>',
    st.contact && '💬 ' + esc(st.contact),
    st.note && '📝 ' + esc(st.note)
  ].filter(Boolean).map(s => '<div>' + s + '</div>').join('');

  $('#app').innerHTML = `
    <header><div class="inner">
      <h1>${esc(st.name)} <span class="pill ${o.status}">${STATUS[o.status]}</span></h1>
      <div class="contact">${contact}</div>
      <div class="sub">由 ${esc(o.creatorName)} 開團、收款・你是 ${esc(v.me.name)}${v.me.isManager ? '（可管理）' : ''}</div>
    </div></header>
    <nav class="tabs">
      <button data-tab="menu" class="${S.tab === 'menu' ? 'on' : ''}">點餐</button>
      <button data-tab="board" class="${S.tab === 'board' ? 'on' : ''}">總表・付款（${v.totals.people}）</button>
    </nav>
    <div class="wrap">${S.tab === 'menu' ? renderMenu() : renderBoard()}</div>
    ${S.tab === 'menu' ? renderCartBar() : ''}`;

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  bind();
}

function renderMenu() {
  const v = S.view; const open = v.order.status === 'open';
  let h = '';
  if (!open) h += `<div class="card"><div class="note">這團${STATUS[v.order.status]}，不能再修改餐點。</div></div>`;

  const last = (v.me.lastItems || []).filter(l => findItem(l.name));
  if (open && !S.cart.length && last.length) {
    h += `<div class="card"><h2><span>上次在這家點的</span></h2>
      <div class="row"><div class="meta">${esc(last.map(l => lineLabel(l) + ' ×' + l.qty).join('、'))}</div>
      <button class="btn sm" data-act="repeat">跟上次一樣</button></div></div>`;
  }

  if (S.cart.length) {
    h += `<div class="card"><h2><span>我的餐點${S.dirty ? '（尚未送出）' : ''}</span><span class="price">${money(cartTotal())}</span></h2>` +
      S.cart.map((l, i) => `<div class="row">
        <div><div class="name">${esc(lineLabel(l))}</div><div class="meta">${money(unitPrice(l))} × ${l.qty}</div></div>
        ${open ? `<div class="btns"><button class="btn ghost sm" data-act="edit" data-i="${i}">修改</button><button class="btn ghost sm" data-act="del" data-i="${i}">刪除</button></div>` : ''}
      </div>`).join('') + '</div>';
  }

  const cats = v.store.categories;
  if (!cats.length) return h + '<div class="card"><div class="empty">這家店還沒有菜單資料。</div></div>';
  if (cats.length > 1) h += '<div class="catnav">' + cats.map((c, i) => `<a href="#cat${i}">${esc(c.name)}</a>`).join('') + '</div>';
  h += cats.map((c, ci) => `<div class="card" id="cat${ci}"><h2>${esc(c.name)}</h2>` +
    c.items.map((it, ii) => `<div class="row ${open ? 'tap' : ''}" ${open ? `data-act="pick" data-c="${ci}" data-i="${ii}"` : ''}>
      <div><div class="name">${esc(it.name)}</div>${it.note ? `<div class="meta">${esc(it.note)}</div>` : ''}</div>
      <div class="price">${esc(itemPriceText(it))}</div></div>`).join('') + '</div>').join('');
  return h;
}

function renderCartBar() {
  const open = S.view.order.status === 'open';
  if (!open || (!S.cart.length && !S.dirty)) return '';
  const label = !S.cart.length ? '清空我的餐點' : S.dirty ? '送出餐點' : '已送出 ✓';
  return `<div class="cartbar"><div class="inner">
    <div class="sum">${cartCount()} 份・小計 <b>${money(cartTotal())}</b><br>運費分攤另計</div>
    <button class="btn" data-act="submit" ${S.dirty ? '' : 'disabled'}>${label}</button>
  </div></div>`;
}

function renderBoard() {
  const v = S.view; const t = v.totals; const me = v.me; const o = v.order;
  let h = `<div class="card"><div class="stats">
      <div><b>${money(t.grand)}</b><span>總額</span></div>
      <div><b>${money(t.paid)}</b><span>已收</span></div>
      <div><b style="color:${t.outstanding > 0 ? 'var(--bad)' : 'inherit'}">${money(t.outstanding)}</b><span>還差</span></div>
    </div>
    ${(t.deliveryFee || t.discount) ? `<div class="row meta">餐點 ${money(t.itemsTotal)}　運費 ${money(t.deliveryFee)}${t.discount ? '　折扣 -' + money(t.discount) : ''}（每人平均分攤）</div>` : ''}
    <div class="note">付款給 ${esc(o.creatorName)}${v.payInfo ? '：' + esc(v.payInfo) : ''}<br>付完請按自己那欄的「我付了」，${esc(o.creatorName)} 確認後會變成已收款。</div>
  </div>`;

  if (me.isManager) {
    h += `<div class="card"><h2>管理</h2><div class="manage">
      <label>運費 <input class="field" type="number" inputmode="numeric" min="0" id="fee" value="${t.deliveryFee}"></label>
      <label>折扣 <input class="field" type="number" inputmode="numeric" min="0" id="disc" value="${t.discount}"></label>
      <div class="btns" style="justify-content:flex-start">
        <button class="btn sm" data-act="saveFee">儲存運費／折扣</button>
        ${o.status === 'open' ? '<button class="btn warn sm" data-act="status" data-s="closed">收單</button>' : ''}
        ${o.status !== 'open' ? '<button class="btn ghost sm" data-act="status" data-s="open">重新開放點餐</button>' : ''}
        ${o.status !== 'done' ? '<button class="btn ghost sm" data-act="status" data-s="done">結單</button>' : ''}
      </div></div></div>`;
  }

  if (v.notOrdered && v.notOrdered.length && o.status === 'open') {
    h += `<div class="card"><h2><span>還沒點餐</span><span>${v.notOrdered.length} 人</span></h2>
      <div class="row"><div class="meta">${esc(v.notOrdered.join('、'))}</div></div></div>`;
  }

  if (v.merged && v.merged.length) {
    const qty = v.merged.reduce((n, x) => n + x.qty, 0);
    h += `<div class="card"><h2><span>下單清單</span><span>共 ${qty} 份</span></h2>` +
      (me.isManager && v.storeOrderUrl ? `<div class="row"><div class="meta">打開店家 LINE 並填好訂單，按送出即可</div><a class="btn sm" style="text-decoration:none" href="${esc(v.storeOrderUrl)}">📤 傳給店家</a></div>` : '') +
      v.merged.map(x => `<div class="row"><div><div class="name">${esc(x.label)}</div>${x.notes.length ? `<div class="meta">${esc(x.notes.join('；'))}</div>` : ''}</div><div class="price">×${x.qty}</div></div>`).join('') +
      '</div>';
  }

  const entries = v.entries.slice().sort((a, b) => (a.userId === me.userId ? -1 : b.userId === me.userId ? 1 : 0));
  h += `<div class="card"><h2><span>每人明細</span><span>${t.people} 人</span></h2>`;
  if (!entries.length) h += '<div class="empty">還沒有人點餐</div>';
  h += entries.map(e => {
    const mine = e.userId === me.userId;
    const btns = [];
    if (mine && e.payStatus === 'unpaid') {
      btns.push(`<button class="btn sm" data-act="pay" data-u="${esc(e.userId)}" data-s="claimed" data-m="linepay">我付了 LINE Pay</button>`);
      btns.push(`<button class="btn ghost sm" data-act="pay" data-u="${esc(e.userId)}" data-s="claimed" data-m="cash">我付了 現金</button>`);
    }
    if (mine && !me.isManager && e.payStatus === 'claimed') btns.push(`<button class="btn ghost sm" data-act="pay" data-u="${esc(e.userId)}" data-s="unpaid">取消回報</button>`);
    if (me.isManager && e.payStatus !== 'paid') btns.push(`<button class="btn sm" data-act="pay" data-u="${esc(e.userId)}" data-s="paid">確認收款</button>`);
    if (me.isManager && e.payStatus !== 'unpaid') btns.push(`<button class="btn ghost sm" data-act="pay" data-u="${esc(e.userId)}" data-s="unpaid">改回未付</button>`);
    const share = e.share ? `（含分攤 ${e.share > 0 ? '+' : ''}${e.share}）` : '';
    return `<div class="entry ${mine ? 'mine' : ''}">
      <div class="top"><div><b>${esc(e.displayName)}${mine ? '（我）' : ''}</b>　<span class="price">${money(e.amount)}</span><span class="meta" style="font-size:12px;color:var(--muted)">${share}</span></div>
      <span class="badge ${e.payStatus}">${PAY[e.payStatus]}${e.payStatus !== 'unpaid' && e.payMethod ? '・' + (METHOD[e.payMethod] || e.payMethod) : ''}</span></div>
      <ul>${e.items.map(i => `<li>${esc(lineLabel(i))} ×${i.qty}　${money(i.total)}</li>`).join('')}</ul>
      ${btns.length ? `<div class="btns">${btns.join('')}</div>` : ''}
    </div>`;
  }).join('');
  h += '</div>';
  return h;
}

/* ---------- 選品項 ---------- */
function openPicker(item, editIndex) {
  const base = editIndex != null ? S.cart[editIndex] : null;
  const st = {
    size: base ? base.size : (item.sizes && item.sizes.length === 1 ? item.sizes[0].name : ''),
    options: base ? base.options.slice() : [],
    qty: base ? base.qty : 1,
    note: base ? base.note : ''
  };
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  const draw = () => {
    const line = { name: item.name, size: st.size, options: st.options, qty: st.qty };
    bg.innerHTML = `<div class="sheet">
      <h3>${esc(item.name)}</h3>${item.note ? `<div class="meta" style="color:var(--muted);font-size:14px">${esc(item.note)}</div>` : ''}
      ${item.sizes && item.sizes.length ? `<div class="group"><div>尺寸（必選）</div><div class="chips">${item.sizes.map(s =>
        `<button class="chip ${st.size === s.name ? 'on' : ''}" data-size="${esc(s.name)}">${esc(s.name)} ${money(s.price)}</button>`).join('')}</div></div>` : ''}
      ${item.options && item.options.length ? `<div class="group"><div>加料（可複選）</div><div class="chips">${item.options.map(op =>
        `<button class="chip ${st.options.includes(op.name) ? 'on' : ''}" data-opt="${esc(op.name)}">${esc(op.name)} +${op.price}</button>`).join('')}</div></div>` : ''}
      <div class="group"><div>備註（甜度、冰塊、不要蔥…）</div><input class="field" id="pnote" maxlength="60" value="${esc(st.note)}" placeholder="選填"></div>
      <div class="group"><div>數量</div><div class="qty"><button data-q="-1">−</button><b>${st.qty}</b><button data-q="1">＋</button></div></div>
      <div class="actions"><button class="btn ghost" data-x="cancel">取消</button>
        <button class="btn" data-x="ok">${editIndex != null ? '更新' : '加入'}　${money(unitPrice(line) * st.qty)}</button></div>
    </div>`;
    bg.querySelectorAll('[data-size]').forEach(b => b.onclick = () => { st.note = $('#pnote', bg).value; st.size = b.dataset.size; draw(); });
    bg.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
      st.note = $('#pnote', bg).value;
      const n = b.dataset.opt; st.options = st.options.includes(n) ? st.options.filter(x => x !== n) : st.options.concat(n); draw();
    });
    bg.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { st.note = $('#pnote', bg).value; st.qty = Math.max(1, Math.min(99, st.qty + Number(b.dataset.q))); draw(); });
    bg.querySelector('[data-x=cancel]').onclick = () => bg.remove();
    bg.querySelector('[data-x=ok]').onclick = () => {
      if (item.sizes && item.sizes.length && !st.size) { toast('請先選尺寸'); return; }
      const l = { name: item.name, size: st.size, options: st.options, qty: st.qty, note: $('#pnote', bg).value.trim() };
      if (editIndex != null) S.cart[editIndex] = l; else S.cart.push(l);
      S.dirty = true; bg.remove(); render();
      toast(editIndex != null ? '已更新，記得按「送出餐點」' : '已加入，記得按「送出餐點」');
    };
  };
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  draw();
  document.body.appendChild(bg);
}

/* ---------- 事件 ---------- */
function bind() {
  document.querySelectorAll('[data-act]').forEach(el => el.onclick = async () => {
    const a = el.dataset.act;
    if (a === 'pick') return openPicker(S.view.store.categories[el.dataset.c].items[el.dataset.i]);
    if (a === 'edit') { const l = S.cart[el.dataset.i]; const it = findItem(l.name); if (it) openPicker(it, Number(el.dataset.i)); return; }
    if (a === 'repeat') {
      S.cart = (S.view.me.lastItems || []).filter(l => findItem(l.name))
        .map(l => ({ name: l.name, size: l.size, options: (l.options || []).slice(), qty: l.qty, note: l.note }));
      S.dirty = true; render(); toast('已帶入上次的餐點，確認後按「送出餐點」'); return;
    }
    if (a === 'del') { S.cart.splice(Number(el.dataset.i), 1); S.dirty = true; render(); return; }
    if (a === 'submit') return run(() => api('saveMyEntry', { items: S.cart }), '已送出 ✓', true);
    if (a === 'pay') {
      const s = el.dataset.s;
      if (s === 'paid' && !confirm('確認已經收到這筆款項？')) return;
      return run(() => api('setPay', { userId: el.dataset.u, status: s, method: el.dataset.m || '' }),
        s === 'claimed' ? '已回報，等待確認' : s === 'paid' ? '已確認收款' : '已改回未付');
    }
    if (a === 'saveFee') return run(() => api('setOrder', { deliveryFee: $('#fee').value || 0, discount: $('#disc').value || 0 }), '已更新運費／折扣');
    if (a === 'status') {
      const s = el.dataset.s;
      if (s === 'done' && S.view.totals.outstanding > 0 && !confirm('還有人沒付款，確定要結單？')) return;
      return run(() => api('setOrder', { status: s }), s === 'closed' ? '已收單' : s === 'done' ? '已結單' : '已重新開放');
    }
  });
}

async function run(fn, okMsg, resetCart) {
  if (S.busy) return;
  S.busy = true;
  document.querySelectorAll('[data-act]').forEach(b => b.disabled = true);
  try {
    const v = await fn();
    if (resetCart) S.dirty = false;
    apply(v, resetCart);
    toast(okMsg);
  } catch (e) {
    toast(e.message || '發生錯誤');
    render();
  } finally {
    S.busy = false;
  }
}

boot();
</script>
</body>
</html>
